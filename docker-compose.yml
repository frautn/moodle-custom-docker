x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-moodle: &moodle
  build: .
  image: moodle-custom:5.3
  restart: unless-stopped
  init: true
  environment:
    POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  volumes:
    - type: bind
      source: /mnt/data/moodle
      target: /var/www/html
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./config.php
      target: /var/www/html/config.php
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /mnt/data/moodledata
      target: /var/www/moodledata
      bind:
        create_host_path: false
  logging: *logging
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --auth-host=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - type: bind
        source: /mnt/data/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *logging
    security_opt:
      - no-new-privileges:true

  moodle:
    <<: *moodle
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  cron:
    <<: *moodle
    user: www-data
    command: moodle-cron
    depends_on:
      db:
        condition: service_healthy
      moodle:
        condition: service_healthy
    stop_grace_period: 5m
